<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="el">
<head>
    <meta charset="UTF-8">
    <title>Book room</title>
</head>
<body>

<h2 th:text="'Κράτηση: ' + ${room.name}">Κράτηση</h2>

<div th:if="${error}" style="color:red;">
    <p th:text="${error}">Error</p>
</div>

<form th:action="@{/rooms/{id}/book(id=${room.id})}" method="post">

    <!-- ✅ CSRF token για να μη βγάζει 403 -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <p>
        <label>Start (LocalDateTime):</label><br>
        <input type="text" name="start" placeholder="2026-01-18T16:00" required>
    </p>

    <p>
        <label>End (LocalDateTime):</label><br>
        <input type="text" name="end" placeholder="2026-01-18T17:00" required>
    </p>

    <button type="submit">Create booking</button>
</form>

<p><a href="/rooms">← Back to rooms</a></p>

</body>
</html>
